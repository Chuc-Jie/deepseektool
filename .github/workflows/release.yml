name: Release

on:
  push:
    branches: [master]
    paths:
      - 'deepseektool.user.js'
      - '.github/workflows/release.yml'

  workflow_dispatch:  # 手动触发

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，方便对比版本

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep -oP '@version\s+\K[\d.]+' deepseektool.user.js)
          echo "current=$VERSION" >> "$GITHUB_OUTPUT"
          echo "当前版本: $VERSION"

      - name: Release 是否已存在
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 防重复守护以「该版本号的 Release 是否已存在于 GitHub」为准，而非比对最新 git tag。
          # 否则 tag 一旦被提前推上去（v4.7.0 先打标即属此例），发布任务会被误判“版本未变化而跳过”，
          # 结果是只有 tag、始终没有真正生成 Release。
          if gh release view v${{ steps.version.outputs.current }} >/dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Release v${{ steps.version.outputs.current }} 已存在，跳过发布"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "未找到 Release v${{ steps.version.outputs.current }}，准备发布"
          fi

      - name: 打包源码
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION=${{ steps.version.outputs.current }}
          git archive --format=zip --output=deepseektool-v${VERSION}.zip HEAD
          echo "打包完成: deepseektool-v${VERSION}.zip"

      - name: 提取 CHANGELOG 条目
        id: changelog
        if: steps.check.outputs.changed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.current }}"
          # 提取当前版本的 CHANGELOG 条目（从 "## v{VERSION}" 到下一个 "## " 或 EOF）
          SECTION=$(awk -v ver="v${VERSION}" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^#{2,3} v/ { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            SECTION="请查看 [CHANGELOG.md](CHANGELOG.md) 了解更新详情。"
          fi
          echo "$SECTION" > release_body.md
          echo "提取到 CHANGELOG 条目 (${#SECTION} 字符)"

      - name: 创建 Release
        if: steps.check.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.current }}
          name: v${{ steps.version.outputs.current }}
          body_path: release_body.md
          files: |
            deepseektool.user.js
            deepseektool-v${{ steps.version.outputs.current }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
