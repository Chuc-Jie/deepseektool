<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DeepSeek 功能增强工具箱</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header class="popup__header">
      <img class="popup__logo" src="icons/icon.svg" alt="" width="34" height="34">
      <div class="popup__identity">
        <h1 class="popup__name">DeepSeek 工具箱</h1>
        <p class="popup__tagline">DeepSeek 对话页增强</p>
      </div>
      <span class="popup__version" id="version">—</span>
    </header>

    <section class="panel-card" aria-labelledby="start-title">
      <h2 class="panel-card__title" id="start-title">快速开始</h2>

      <p class="status" id="status" data-tone="busy" role="status" aria-live="polite">
        正在检测当前页面…
      </p>

      <button class="action action--primary" id="open-deepseek" type="button">
        <svg class="action__icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>
        </svg>
        <span>打开 DeepSeek</span>
      </button>
    </section>

    <section class="panel-card" id="actions-card" aria-labelledby="actions-title" hidden>
      <h2 class="panel-card__title" id="actions-title">快捷操作</h2>

      <div class="actions">
        <button class="action action--primary" id="open-panel" type="button" disabled>
          <svg class="action__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 7h8M18 7h2M4 17h2M10 17h10"/>
            <circle cx="15" cy="7" r="3"/>
            <circle cx="7" cy="17" r="3"/>
          </svg>
          <span>打开设置</span>
        </button>

        <button class="action" id="export-chat" type="button" disabled>
          <svg class="action__icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 3v11m0 0 4-4m-4 4-4-4M5 19h14"/>
          </svg>
          <span>导出当前对话</span>
        </button>
      </div>
    </section>

    <footer class="popup__footer">
      <span>设置只保存在这个扩展里</span>
      <span id="footer-version">扩展版本 —</span>
    </footer>
  </main>

  <script src="popup.js"></script>
</body>
</html>
